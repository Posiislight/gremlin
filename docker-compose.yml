services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: gremlin
      POSTGRES_PASSWORD: gremlin
      POSTGRES_DB: gremlin
    ports:
      - "${GREMLIN_PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gremlin -d gremlin"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO stopped publishing official Docker Hub/Quay images; bitnamilegacy mirrors are used.
  minio:
    image: bitnamilegacy/minio:latest
    environment:
      MINIO_ROOT_USER: gremlin
      MINIO_ROOT_PASSWORD: gremlin-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: bitnamilegacy/minio-client:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 gremlin gremlin-secret; do sleep 2; done &&
      mc mb --ignore-existing local/gremlin &&
      echo 'bucket gremlin ready'
      "
    restart: "no"

volumes:
  pgdata:
  miniodata:
