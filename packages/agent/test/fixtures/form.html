<!doctype html>
<html><head><title>Form fixture</title></head>
<body>
<main>
  <h1>Sign up</h1>
  <form aria-label="Signup form" onsubmit="return false">
    <label>Email <input type="email" name="email"></label>
    <label for="pw">Password</label><input id="pw" type="password" name="pw" value="secret">
    <input type="text" placeholder="Nickname" name="nick">
    <button type="submit">Create account</button>
    <button type="button" disabled>Save draft</button>
    <button type="button" aria-label="Close dialog">X</button>
    <button type="button" hidden>Hidden by attribute</button>
    <button type="button" style="display:none">Hidden by css</button>
    <div aria-hidden="true"><button type="button">Hidden subtree</button></div>
  </form>
  <div role="alert">Email is required</div>
  <div role="alert"></div>
  <div class="toast">Not an alert region</div>
</main>
</body></html>
